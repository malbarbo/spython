[package]
name = "engine"
version = "0.3.0"
edition = "2024"

# The checker over the filesystem, and the overlay that serves the embedded
# lib to it, are native only: the page checks in memory.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ruff_db = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3", features = ["os"] }
ruff_notebook = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
dirs = { package = "dirs-next", version = "2.0" }
dunce = "1"
walkdir = "2"
# The display of a World and of animate, the image that the REPL prints,
# the measure of a text, and the macros of the pyclass that holds the
# display. The page draws and measures for itself.
sinteract = { path = "../../sinteract" }
rustpython-vm = { git = "https://github.com/malbarbo/RustPython.git", branch = "spython-0.3", default-features = false }
# The data URI of a bitmap.
base64 = "0.22"

[target.'cfg(all(not(target_arch = "wasm32"), not(windows)))'.dependencies]
rustpython = { git = "https://github.com/malbarbo/RustPython.git", branch = "spython-0.3", default-features = false, features = ["freeze-stdlib", "stdio", "importlib", "host_env", "threading"] }

[target.'cfg(all(not(target_arch = "wasm32"), windows))'.dependencies]
rustpython = { git = "https://github.com/malbarbo/RustPython.git", branch = "spython-0.3", default-features = false, features = ["freeze-stdlib", "stdio", "importlib", "host_env", "host_env_extras", "threading"] }

# On wasm32, drop features that don't work (host_env, threading, ssl).
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustpython = { git = "https://github.com/malbarbo/RustPython.git", branch = "spython-0.3", default-features = false, features = ["freeze-stdlib", "stdio", "importlib"] }
# The size of a bitmap, from the header in its data URI.
sinteract = { path = "../../sinteract", default-features = false }
base64 = "0.22"

[lints]
workspace = true

[dependencies]
ty_project = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ty_python_semantic = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ty_module_resolver = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_db = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_python_ast = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_text_size = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_ranged_value = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_macros = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_python_formatter = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_python_stdlib = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
ruff_python_parser = { git = "https://github.com/malbarbo/ruff.git", branch = "spython-0.3" }
