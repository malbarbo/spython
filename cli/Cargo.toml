[package]
name = "spython"
version = "0.3.0"
edition = "2024"
default-run = "spython"

[lints]
workspace = true

[dependencies]
engine = { path = "../engine" }
bpaf = { version = "0.9", features = ["derive", "bright-color"] }
rustyline = "18"
dirs = { package = "dirs-next", version = "2.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# When enabled, the CLI integration tests also run their `run`, `check` and
# `test` invocations through the WASM backend (via `wasm/spython.ts` + Deno)
# and assert that stdout/stderr match the native binary after normalization.
# Requires the `wasm32-wasip1` target and Deno on PATH. Enable with
# `cargo test -p spython --features wasm-backend --test cli`.
wasm-backend = []

[dev-dependencies]
assert_cmd = "2.0.16"
indoc = "2"
insta = { version = "1.41.1", features = ["filters"] }
tempfile = "3.27.0"
