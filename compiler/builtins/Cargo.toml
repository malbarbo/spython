[package]
name = "builtins"
version = "0.3.0"
edition = "2024"
publish = false

# `compiler/build.rs` builds this crate for wasm32, so it stays out of the
# workspace and its native builds.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fast-float2 = { version = "0.2.4", default-features = false }
libm = "0.2"
ryu = "1"

# `no-panic` proves at link time that `parse` has no path to a panic, which
# holds only in an optimized build, as the wasm32 one is.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fast-float2 = { version = "0.2.4", default-features = false, features = ["no-panic"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
