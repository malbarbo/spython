[package]
name = "builtins"
version = "0.3.0"
edition = "2024"
publish = false

# `compiler/build.rs` builds this crate for wasm32, so it stays out of the
# workspace and its native builds.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ryu = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
